[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ingest-conservation-guard"
version = "0.5.0"
description = "Receipts of bucket conservation for data ingestion: dominio == imagen + rechazos + sin_clave + colisiones"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Platino Labs"}]
keywords = ["data-ingestion", "etl", "migration", "conservation", "audit", "pii"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ingest-conservation-guard = "ingest_conservation_guard.cli:main"

[project.urls]
Homepage = "https://github.com/alexisromtz-lab/ingest-conservation-guard"
Repository = "https://github.com/alexisromtz-lab/ingest-conservation-guard"
Issues = "https://github.com/alexisromtz-lab/ingest-conservation-guard/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ingest_conservation_guard = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
