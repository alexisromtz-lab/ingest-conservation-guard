name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: unit tests
        run: pytest -o addopts="" -q
      - name: Contract - conserved exits 0
        run: |
          python -m ingest_conservation_guard sku-completa || { echo "RC inesperado"; exit 1; }
      - name: Contract - merge exits 1
        run: |
          if python -m ingest_conservation_guard sku; then exit 0; else
            rc=$?; test "$rc" -eq 1 || { echo "RC $rc, se esperaba 1"; exit 1; }; fi
      - name: Contract - rupture exits 4
        run: |
          if python -m ingest_conservation_guard ruptura; then exit 1; else
            rc=$?; test "$rc" -eq 4 || { echo "RC $rc, se esperaba 4"; exit 1; }; fi

  replay-censo:
    # The pin is only worth what its reader can refuse. This job fetches the
    # export the census names, checks its SHA-256 before measuring anything, and
    # recomputes every published cell: 0 identical, 1 diverged, 2 unreachable,
    # 4 the bytes on disk are not the pinned export.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: re-derive censo.json from the export it names
        run: python bench/replay_censo.py
